server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Static files (the built React app)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker's internal DNS. Looking the backend up again every 10 s means a
    # restarted backend (new IP) is found without restarting Nginx, and a
    # stopped backend gives a quick 502 instead of a 60 s timeout.
    resolver 127.0.0.11 valid=10s;

    # Forward API calls to the backend container
    location /api/ {
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
